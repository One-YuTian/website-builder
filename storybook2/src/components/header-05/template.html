<!-- Region: Top Announcement Bar - Top promotional broadcast bar.
     Configurable with three primary message formats:
     1) Brand Tagline / Value Proposition (e.g., "Official Flagship Store | 100% Authentic Guarantee | Free Global Delivery");
     2) Promotional Discount Notice (e.g., "Storewide Sale: Up to 50% OFF for a limited time");
     3) Limited-Time Countdown Timer (e.g., "Special promo ends in 04:15:32 - Target countdown to 23:59:59 today"). -->
<div class="bg-primary text-on-secondary py-2 font-sans">
  <div class="w-full max-w-content mx-auto px-4 lg:px-6 flex items-center justify-center text-center">
    <span class="block h-[0.75em] w-72 max-w-full rounded-sm bg-on-secondary/30"></span>
  </div>
</div>
<header class="bg-surface text-content border-b border-outline/50 shadow-xs font-sans">
  <!-- Region: Header Main Bar - Brand logo, search, navigation, and user actions -->

  <div data-region="header-content" class="w-full max-w-content mx-auto px-4 lg:px-6">
    <div class="flex h-16 items-center justify-between gap-4">
      <div class="shrink-0">
        <div role="button" tabindex="0" data-destination="home" class="flex h-10 items-center rounded-sm focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
          <span class="relative flex h-10 w-32 items-center justify-center overflow-hidden rounded-xl bg-accent select-none text-xs font-semibold tracking-widest text-muted">LOGO</span>
        </div>
      </div>
      <form role="search" class="relative hidden flex-1 max-w-2xl mx-6 md:block">
        <div class="relative flex h-10 items-center rounded-lg border border-outline bg-surface text-content focus-within:ring-2 focus-within:ring-primary">
          <input type="search" name="query" autocomplete="off" class="h-full w-full min-w-0 rounded-lg border-0 bg-transparent py-1.5 pl-4 pr-10 text-sm outline-none">
          <!-- Region: Search Placeholder - Search input prompt -->

          <span data-region="search-placeholder" class="pointer-events-none absolute left-4"><span class="block h-[0.75em] w-36 rounded-sm bg-accent"></span></span>
          <button type="submit" class="mr-1 flex size-7 shrink-0 items-center justify-center rounded-full focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
            <span class="block size-3.5 rounded-full bg-accent"></span>
          </button>
        </div>
        <!-- Region: Search Suggestions - Autocomplete dropdown list -->

        <ul data-region="search-suggestions" hidden class="absolute inset-x-0 top-full z-20 mt-2 max-h-80 overflow-y-auto rounded-xl border border-outline bg-surface p-2 text-content shadow-xl"></ul>
      </form>
      <div class="hidden items-center gap-3 md:flex">
        <div role="button" tabindex="0" data-destination="login" class="text-sm font-medium hover:text-primary transition-colors focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-14 rounded-sm bg-accent"></span></div>
        <div role="button" tabindex="0" data-destination="register" class="text-sm font-medium hover:text-primary transition-colors focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-14 rounded-sm bg-accent"></span></div>
        <button type="button" data-action="wishlist" class="relative flex size-10 shrink-0 items-center justify-center rounded-lg hover:bg-accent/40 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
          <span class="block size-5 rounded-full bg-accent"></span>
        </button>
        <button type="button" data-action="cart" class="relative flex size-10 shrink-0 items-center justify-center rounded-lg hover:bg-accent/40 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
          <span class="block size-5 rounded-full bg-accent"></span>
        </button>
      </div>
      <div class="flex items-center gap-2 md:hidden">
        <button type="button" data-action="cart" class="relative flex size-10 shrink-0 items-center justify-center rounded-lg hover:bg-accent/40 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
          <span class="block size-5 rounded-full bg-accent"></span>
        </button>
        <button type="button" data-action="menu" class="flex size-10 shrink-0 items-center justify-center rounded-lg hover:bg-accent/40 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
          <span class="block size-5 rounded-full bg-accent"></span>
        </button>
      </div>
    </div>
    <!-- Region: Primary Navigation Menu -->

    <nav class="hidden items-center justify-center gap-8 border-t border-outline/30 py-3 md:flex">
      <div role="button" tabindex="0" data-destination="home" class="text-sm font-medium uppercase tracking-wider hover:text-primary transition-colors focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-12 rounded-sm bg-accent"></span></div>
      <div role="button" tabindex="0" data-destination="shop" class="text-sm font-medium uppercase tracking-wider hover:text-primary transition-colors focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-12 rounded-sm bg-accent"></span></div>
      <div role="button" tabindex="0" data-destination="about" class="text-sm font-medium uppercase tracking-wider hover:text-primary transition-colors focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-12 rounded-sm bg-accent"></span></div>
      <div role="button" tabindex="0" data-destination="contact" class="text-sm font-medium uppercase tracking-wider hover:text-primary transition-colors focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-12 rounded-sm bg-accent"></span></div>
    </nav>
  </div>
</header>
<!-- Region: Mobile Navigation Drawer -->

<dialog class="fixed inset-y-0 left-0 m-0 h-dvh max-h-none w-80 max-w-[calc(100vw-2rem)] overflow-y-auto overscroll-contain border-0 bg-surface p-6 text-content shadow-xl backdrop:bg-black/50">
  <div class="mb-6 flex items-center justify-between gap-4">
    <span class="relative flex h-8 w-28 items-center justify-center overflow-hidden rounded-lg bg-accent select-none text-xs font-semibold tracking-widest text-muted">LOGO</span>
    <button type="button" autofocus data-action="close-menu" class="flex size-10 items-center justify-center rounded-lg hover:bg-accent/40 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
      <span class="block size-5 rounded-full bg-accent"></span>
    </button>
  </div>
  <nav class="space-y-3">
    <div role="button" tabindex="0" data-destination="home" class="block rounded-lg px-2 py-3 hover:bg-accent/40"><span class="block h-[0.75em] w-24 rounded-sm bg-accent"></span></div>
    <div role="button" tabindex="0" data-destination="shop" class="block rounded-lg px-2 py-3 hover:bg-accent/40"><span class="block h-[0.75em] w-24 rounded-sm bg-accent"></span></div>
    <div role="button" tabindex="0" data-destination="about" class="block rounded-lg px-2 py-3 hover:bg-accent/40"><span class="block h-[0.75em] w-24 rounded-sm bg-accent"></span></div>
    <div role="button" tabindex="0" data-destination="contact" class="block rounded-lg px-2 py-3 hover:bg-accent/40"><span class="block h-[0.75em] w-24 rounded-sm bg-accent"></span></div>
  </nav>
  <div class="mt-6 flex flex-col items-start gap-3 border-t border-outline px-2 pt-6">
    <div role="button" tabindex="0" data-destination="login" class="rounded-sm py-2 hover:opacity-75 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-16 rounded-sm bg-accent"></span></div>
    <div role="button" tabindex="0" data-destination="register" class="rounded-sm py-2 hover:opacity-75 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-16 rounded-sm bg-accent"></span></div>
  </div>
</dialog>
