<section class="py-6 font-sans text-content bg-surface">
  <div class="w-full max-w-content mx-auto px-4 lg:px-6">
    <div class="h-6 md:h-7 w-36 bg-accent rounded-sm mb-4"></div>
    <div class="bg-surface rounded-xl shadow-xs border border-outline/30 p-4 md:p-6">
      <div class="flex items-center justify-between mb-4 sm:mb-6 pb-3 sm:pb-4 border-b border-outline/30 gap-2 sm:gap-4">
        <div class="flex items-center gap-2 sm:gap-4 min-w-0">
          <div class="h-4 sm:h-5 w-20 sm:w-28 bg-accent rounded-xs shrink-0"></div>
          <div class="h-3 sm:h-4 w-12 sm:w-16 bg-muted/60 rounded-xs shrink-0 hidden xs:block"></div>
          <!-- Region: Countdown Timer - Urgent limited-time flash sale timer -->

          <div class="flex items-center gap-1 shrink-0" data-region="countdown">
            <span class="bg-primary text-white px-1.5 sm:px-2 py-0.5 sm:py-1 text-[11px] sm:text-xs font-bold rounded-xs min-w-6 sm:min-w-7 text-center">00</span>
            <span class="text-content font-bold text-xs">:</span>
            <span class="bg-primary text-white px-1.5 sm:px-2 py-0.5 sm:py-1 text-[11px] sm:text-xs font-bold rounded-xs min-w-6 sm:min-w-7 text-center">00</span>
            <span class="text-content font-bold text-xs">:</span>
            <span class="bg-primary text-white px-1.5 sm:px-2 py-0.5 sm:py-1 text-[11px] sm:text-xs font-bold rounded-xs min-w-6 sm:min-w-7 text-center">00</span>
          </div>
        </div>
        <div role="button" tabindex="0" class="shrink-0 inline-flex items-center justify-center border-2 border-primary text-primary px-2.5 sm:px-4 py-1 sm:py-1.5 text-xs sm:text-sm font-medium rounded-sm hover:bg-primary hover:text-white transition-colors cursor-pointer whitespace-nowrap">
          <div class="h-3 sm:h-3.5 w-14 sm:w-24 bg-primary/70 rounded-xs"></div>
        </div>
      </div>
      <!-- Region: Flash Sale Products Swiper - MANDATORY REQUIREMENT: Must use <flashcard-01> component for each product card inside Swiper slides -->
      <div class="relative" data-region="products-swiper">
        <div class="swiper flash-sale-swiper-01 overflow-hidden">
          <div class="swiper-wrapper py-1">
            
            <div class="swiper-slide !h-auto">
              <flashcard-01 product-id="product-01"></flashcard-01>
            </div>
            
            <div class="swiper-slide !h-auto">
              <flashcard-01 product-id="product-02"></flashcard-01>
            </div>
            
            <div class="swiper-slide !h-auto">
              <flashcard-01 product-id="product-03"></flashcard-01>
            </div>
            
            <div class="swiper-slide !h-auto">
              <flashcard-01 product-id="product-04"></flashcard-01>
            </div>
            
            <div class="swiper-slide !h-auto">
              <flashcard-01 product-id="product-05"></flashcard-01>
            </div>
            
          </div>
        </div>
        <div class="swiper-button-next flash-sale-next-01 !size-8 md:!size-9 after:!text-sm md:after:!text-base !text-primary bg-surface/90 border border-outline/30 rounded-full shadow-xs !right-1"></div>
        <div class="swiper-button-prev flash-sale-prev-01 !size-8 md:!size-9 after:!text-sm md:after:!text-base !text-primary bg-surface/90 border border-outline/30 rounded-full shadow-xs !left-1"></div>
      </div>
    </div>
  </div>
</section>
