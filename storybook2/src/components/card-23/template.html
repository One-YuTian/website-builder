<article class="min-w-0 overflow-hidden rounded-lg border border-outline/40 bg-surface font-sans text-content shadow-xs">
  <!-- Region: Product Image & Badges -->

  <div class="relative">
    <button type="button" data-action="open-product" class="block w-full focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
      <span class="relative block w-full aspect-square overflow-hidden bg-accent">
        <span class="pointer-events-none absolute inset-0 flex items-center justify-center">
          <span class="relative block aspect-[6/5] w-1/4 min-w-4 max-w-12 overflow-hidden rounded-sm border border-muted">
            <span class="absolute right-[15%] top-[15%] size-1/5 rounded-full bg-muted"></span>
            <span class="absolute -bottom-1/4 left-[5%] size-3/4 rotate-45 border-l border-t border-muted"></span>
            <span class="absolute -bottom-1/4 right-0 size-1/2 rotate-45 border-l border-t border-muted"></span>
          </span>
        </span>
      </span>
    </button>
    <div class="pointer-events-none absolute right-2 top-2 rounded-xs bg-primary px-2 py-0.5 text-[10px] font-semibold text-white shadow-xs">-20%</div>
  </div>
  <!-- Region: Product Details & Price -->

  <div class="p-3 border-t border-outline/30 space-y-2">
    <div>
      <span class="block h-[0.75em] w-full rounded-sm bg-accent mb-1.5"></span>
      <span class="block h-[0.75em] w-2/3 rounded-sm bg-accent"></span>
    </div>
    <div class="flex items-center gap-2 pt-1">
      <span class="block h-[0.85em] w-20 rounded-sm bg-primary/70"></span>
      <span class="block h-[0.7em] w-14 rounded-sm bg-accent opacity-60"></span>
    </div>
  </div>
</article>
