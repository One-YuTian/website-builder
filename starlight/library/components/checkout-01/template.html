<section class="checkout-section bg-accent/20 font-sans text-content py-8 sm:py-12">
  <div class="w-full max-w-content mx-auto px-4 lg:px-6">
    <!-- Breadcrumb & Page Title -->
    <!-- Region: Page Header - Title, subtitle, and breadcrumb -->

    <div data-region="page-header" class="mb-8">
      <div class="flex items-center gap-2 text-xs text-muted mb-3">
        <div class="h-2.5 w-12 bg-muted/50 rounded-xs"></div>
        <span>/</span>
        <div class="h-2.5 w-14 bg-muted/50 rounded-xs"></div>
        <span>/</span>
        <div class="h-2.5 w-16 bg-content/70 rounded-xs"></div>
      </div>
      <div class="h-8 sm:h-9 w-44 sm:w-56 bg-content/85 rounded-xs"></div>
    </div>

    <!-- Main 2-Column Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
      <!-- Left: Form Sections (lg:col-span-2) -->
      <!-- Region: Checkout Form - Shipping address, contact, and payment fields -->

      <div data-region="checkout-form" class="lg:col-span-2 space-y-6">
        <!-- Billing & Shipping Info Card -->
        <div class="bg-surface rounded-2xl shadow-sm border border-outline/30 p-6 sm:p-8">
          <div class="flex items-center gap-3 mb-6 pb-4 border-b border-outline/20">
            <div class="h-5 w-40 bg-content/85 rounded-xs"></div>
          </div>

          <form id="billing-form" class="space-y-4" onsubmit="return false;">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <div class="h-3 w-16 bg-content/80 rounded-xs mb-1.5"></div>
                <input type="text" readonly aria-label="First name" class="w-full px-4 py-2.5 bg-surface border border-outline/50 rounded-xl focus:border-primary text-sm shadow-2xs cursor-default">
              </div>
              <div>
                <div class="h-3 w-16 bg-content/80 rounded-xs mb-1.5"></div>
                <input type="text" readonly aria-label="Last name" class="w-full px-4 py-2.5 bg-surface border border-outline/50 rounded-xl focus:border-primary text-sm shadow-2xs cursor-default">
              </div>
            </div>

            <div>
              <div class="h-3 w-20 bg-content/80 rounded-xs mb-1.5"></div>
              <input type="text" readonly aria-label="Email address" class="w-full px-4 py-2.5 bg-surface border border-outline/50 rounded-xl focus:border-primary text-sm shadow-2xs cursor-default">
            </div>

            <div>
              <div class="h-3 w-16 bg-content/80 rounded-xs mb-1.5"></div>
              <div class="flex">
                <span class="inline-flex items-center px-3 rounded-l-xl border border-r-0 border-outline/50 bg-accent/30"><span class="h-2.5 w-4 bg-muted/60 rounded-xs"></span></span>
                <input type="text" readonly aria-label="Phone number" class="flex-1 px-4 py-2.5 bg-surface border border-outline/50 rounded-r-xl focus:border-primary text-sm shadow-2xs cursor-default">
              </div>
            </div>

            <div>
              <div class="h-3 w-24 bg-content/80 rounded-xs mb-1.5"></div>
              <input type="text" readonly aria-label="Shipping address" class="w-full px-4 py-2.5 bg-surface border border-outline/50 rounded-xl focus:border-primary text-sm shadow-2xs cursor-default">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <div class="h-3 w-16 bg-content/80 rounded-xs mb-1.5"></div>
                <input type="text" readonly aria-label="City" class="w-full px-4 py-2.5 bg-surface border border-outline/50 rounded-xl focus:border-primary text-sm shadow-2xs cursor-default">
              </div>
              <div>
                <div class="h-3 w-20 bg-content/80 rounded-xs mb-1.5"></div>
                <input type="text" readonly aria-label="Postal code" class="w-full px-4 py-2.5 bg-surface border border-outline/50 rounded-xl focus:border-primary text-sm shadow-2xs cursor-default">
              </div>
            </div>
          </form>
        </div>

        <!-- Payment Method Card - Mandatory: Cash on Delivery (active) and Online Payment (disabled) -->
        <div class="bg-surface rounded-2xl shadow-sm border border-outline/30 p-6 sm:p-8">
          <div class="flex items-center gap-3 mb-6 pb-4 border-b border-outline/20">
            <div class="h-5 w-36 bg-content/85 rounded-xs"></div>
          </div>

          <!-- Region: Payment Methods Selection - Cash on Delivery (default active) & Online Payment (disabled) -->
          <div class="space-y-3" data-region="payment-methods">
            <!-- Option 1: Cash on Delivery (Active) -->
            <label class="flex items-center justify-between p-4 rounded-xl border-2 border-primary bg-primary/5 cursor-pointer">
              <div class="flex items-center gap-3">
                <input type="radio" name="payment-method" checked class="size-4 text-primary accent-primary">
                <div>
                  <div class="h-3.5 w-28 bg-content/85 rounded-xs mb-1"></div>
                  <div class="h-2.5 w-40 bg-muted/60 rounded-xs"></div>
                </div>
              </div>
              <div class="h-3 w-10 bg-primary/20 rounded-xs"></div>
            </label>

            <!-- Option 2: Online Payment (Disabled) -->
            <label class="flex items-center justify-between p-4 rounded-xl border border-outline/30 bg-surface opacity-60 cursor-not-allowed">
              <div class="flex items-center gap-3">
                <input type="radio" name="payment-method" disabled class="size-4 text-muted">
                <div>
                  <div class="h-3.5 w-24 bg-muted/80 rounded-xs mb-1"></div>
                  <div class="h-2.5 w-32 bg-muted/50 rounded-xs"></div>
                </div>
              </div>
              <div class="h-2.5 w-16 bg-muted/40 rounded-xs"></div>
            </label>
          </div>
        </div>
      </div>

      <!-- Right: Sticky Order Summary (lg:col-span-1) -->
      <!-- Region: Order Summary - Price breakdown, shipping, and total -->

      <div data-region="order-summary" class="lg:col-span-1 sticky top-6">
        <div class="bg-surface rounded-2xl shadow-sm border border-outline/30 p-6 sm:p-7">
          <div class="h-5 w-32 bg-content/85 rounded-xs mb-5 pb-2"></div>

          <!-- Items Mini List -->
          <div class="space-y-3.5 pb-5 border-b border-outline/20">
            <div class="flex items-center gap-3">
              <div class="relative size-12 shrink-0 bg-accent/40 rounded-lg flex items-center justify-center overflow-hidden border border-outline/20">
                <span class="relative block aspect-[6/5] w-1/2 overflow-hidden rounded-xs border border-muted">
                  <span class="absolute right-[15%] top-[15%] size-1/5 rounded-full bg-muted"></span>
                  <span class="absolute -bottom-1/4 left-[5%] size-3/4 rotate-45 border-l border-t border-muted"></span>
                  <span class="absolute -bottom-1/4 right-0 size-1/2 rotate-45 border-l border-t border-muted"></span>
                </span>
              </div>
              <div class="flex-1 min-w-0">
                <div class="h-3 w-11/12 bg-content/80 rounded-xs mb-1"></div>
                <div class="h-2.5 w-16 bg-muted/50 rounded-xs"></div>
              </div>
              <div class="h-3.5 w-14 bg-primary/80 rounded-xs"></div>
            </div>

            <div class="flex items-center gap-3">
              <div class="relative size-12 shrink-0 bg-accent/40 rounded-lg flex items-center justify-center overflow-hidden border border-outline/20">
                <span class="relative block aspect-[6/5] w-1/2 overflow-hidden rounded-xs border border-muted">
                  <span class="absolute right-[15%] top-[15%] size-1/5 rounded-full bg-muted"></span>
                  <span class="absolute -bottom-1/4 left-[5%] size-3/4 rotate-45 border-l border-t border-muted"></span>
                  <span class="absolute -bottom-1/4 right-0 size-1/2 rotate-45 border-l border-t border-muted"></span>
                </span>
              </div>
              <div class="flex-1 min-w-0">
                <div class="h-3 w-10/12 bg-content/80 rounded-xs mb-1"></div>
                <div class="h-2.5 w-16 bg-muted/50 rounded-xs"></div>
              </div>
              <div class="h-3.5 w-14 bg-primary/80 rounded-xs"></div>
            </div>
          </div>

          <!-- Delivery Notice Banner -->
          <div class="my-4 p-3 rounded-xl bg-accent/30 border border-outline/20 flex items-center gap-2.5">
            <span class="size-6 rounded-md bg-primary/10 text-primary flex items-center justify-center">
              <span class="inline-block size-3 rounded-xs border-2 border-primary/70"></span>
            </span>
            <div class="flex-1">
              <div class="h-2.5 w-32 bg-content/80 rounded-xs mb-1"></div>
              <div class="h-2 w-24 bg-muted/50 rounded-xs"></div>
            </div>
          </div>

          <!-- Price Calculations -->
          <div class="space-y-2.5 text-xs text-muted pb-5 border-b border-outline/20">
            <div class="flex justify-between items-center">
              <div class="h-3 w-14 bg-muted/60 rounded-xs"></div>
              <div class="h-3 w-16 bg-content/80 rounded-xs"></div>
            </div>
            <div class="flex justify-between items-center">
              <div class="h-3 w-12 bg-muted/60 rounded-xs"></div>
              <div class="h-3 w-10 bg-emerald-600 rounded-xs"></div>
            </div>
            <div class="flex justify-between items-center pt-2 border-t border-outline/10 text-sm font-semibold text-content">
              <div class="h-4 w-12 bg-content/85 rounded-xs"></div>
              <div class="h-5 w-20 bg-primary rounded-xs"></div>
            </div>
          </div>

          <!-- Place Order Button -->
          <button type="button" data-action="place-order" class="w-full mt-5 py-3.5 px-6 rounded-xl bg-primary text-white font-medium shadow-md hover:opacity-90 transition-opacity flex items-center justify-center cursor-pointer">
            <div class="h-3.5 w-28 bg-white/95 rounded-xs"></div>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
