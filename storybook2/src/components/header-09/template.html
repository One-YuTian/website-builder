<header class="bg-secondary font-sans text-on-secondary py-3 w-full">
  <div class="w-full max-w-content mx-auto px-4 lg:px-6 flex items-center justify-between gap-6">
    <!-- Region: Brand Identity (Logo) - Neutral LOGO placeholder with link to home -->

    <div data-region="logo" class="flex-shrink-0">
      <div role="button" tabindex="0" class="flex items-center rounded-lg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
        <span class="relative flex h-10 w-28 items-center justify-center overflow-hidden rounded-xl bg-accent"><span class="select-none text-xs font-semibold tracking-widest text-muted">LOGO</span></span>
      </div>
    </div>

    <!-- Region: Desktop Navigation - Main category links -->


    <!-- Region: Primary Navigation Menu -->



    <nav data-region="desktop-nav" class="hidden md:flex items-center gap-6">
      <span class="block h-[0.75em] w-12 rounded-sm bg-accent"></span>
      <span class="block h-[0.75em] w-10 rounded-sm bg-accent"></span>
      <span class="block h-[0.75em] w-12 rounded-sm bg-accent"></span>
      <span class="block h-[0.75em] w-14 rounded-sm bg-accent"></span>
    </nav>

    <!-- Region: Search Bar - Predictive input with search icon -->


    <div data-region="search-bar" class="hidden lg:flex flex-1 max-w-xs mx-2">
      <div class="relative w-full">
        <div class="relative flex items-center rounded-lg bg-surface text-content px-3 py-1.5 focus-within:ring-2 focus-within:ring-white">
          <span class="pointer-events-none absolute left-3 select-none"><span class="block h-[0.75em] w-24 rounded-sm bg-accent"></span></span>
          <input type="search" class="w-full bg-transparent text-sm outline-none placeholder:text-transparent" />
          <button type="button" class="flex size-7 shrink-0 items-center justify-center rounded-md hover:bg-on-secondary/10 text-on-secondary">
            <span class="block size-3.5 rounded-full bg-accent"></span>
          </button>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-end gap-1.5 sm:gap-3">
      <button type="button" class="flex size-9 items-center justify-center rounded-lg hover:bg-on-secondary/10 text-on-secondary">
        <span class="block size-4 rounded-full bg-accent"></span>
      </button>

      <button type="button" class="relative flex size-9 items-center justify-center rounded-lg hover:bg-on-secondary/10 text-on-secondary">
        <span class="block size-4 rounded-sm bg-accent"></span>
      </button>

      <button type="button" class="relative flex size-9 items-center justify-center rounded-lg hover:bg-on-secondary/10 text-on-secondary">
        <span class="block size-4 rounded-sm bg-accent"></span>
      </button>

      <button type="button" class="flex size-9 items-center justify-center rounded-lg md:hidden hover:bg-on-secondary/10 text-on-secondary">
        <span class="flex flex-col gap-1"><span class="block h-0.5 w-4 bg-accent"></span><span class="block h-0.5 w-4 bg-accent"></span><span class="block h-0.5 w-4 bg-accent"></span></span>
      </button>
    </div>
  </div>
</header>
