<!-- Desktop Banner Slider -->
<section class="w-full hidden lg:block relative bg-accent font-sans">
  <div class="swiper banner-swiper-14 h-[500px] w-full">
    <div class="swiper-wrapper h-full">
      <!-- Slide 1 -->
      <div class="swiper-slide h-full relative overflow-hidden bg-accent">
        <div class="w-full h-full flex items-center justify-end pr-[10%] bg-accent">
          <span class="relative block aspect-[6/5] w-48 overflow-hidden rounded-md border border-muted/60 opacity-80">
            <span class="absolute right-[15%] top-[15%] size-1/5 rounded-full bg-muted"></span>
            <span class="absolute -bottom-1/4 left-[5%] size-3/4 rotate-45 border-l border-t border-muted"></span>
            <span class="absolute -bottom-1/4 right-0 size-1/2 rotate-45 border-l border-t border-muted"></span>
          </span>
        </div>
        <div class="absolute inset-0 bg-black/40 z-10 pointer-events-none"></div>
        <div class="absolute inset-0 z-20 flex items-center">
          <div class="w-full max-w-content mx-auto px-4 lg:px-6 w-full">
            <div class="max-w-lg md:max-w-xl flex flex-col items-start gap-4">
              <div class="h-10 md:h-12 w-64 bg-white/95 rounded-sm"></div>
              <div class="flex flex-col gap-2 w-full max-w-md">
                <div class="h-4 w-full bg-white/80 rounded-sm"></div>
                <div class="h-4 w-4/5 bg-white/80 rounded-sm"></div>
                <div class="h-4 w-3/5 bg-white/80 rounded-sm"></div>
              </div>
              <div role="button" tabindex="0" class="h-11 w-36 bg-primary rounded-sm shadow-md mt-2 flex items-center justify-center cursor-pointer focus:outline-none focus:ring-2 focus:ring-white">
                <div class="h-3 w-16 bg-white/90 rounded-sm"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Slide 2 -->
      <div class="swiper-slide h-full relative overflow-hidden bg-accent">
        <div class="w-full h-full flex items-center justify-end pr-[10%] bg-accent">
          <span class="relative block aspect-[6/5] w-48 overflow-hidden rounded-md border border-muted/60 opacity-80">
            <span class="absolute right-[15%] top-[15%] size-1/5 rounded-full bg-muted"></span>
            <span class="absolute -bottom-1/4 left-[5%] size-3/4 rotate-45 border-l border-t border-muted"></span>
            <span class="absolute -bottom-1/4 right-0 size-1/2 rotate-45 border-l border-t border-muted"></span>
          </span>
        </div>
        <div class="absolute inset-0 bg-black/40 z-10 pointer-events-none"></div>
        <div class="absolute inset-0 z-20 flex items-center">
          <div class="w-full max-w-content mx-auto px-4 lg:px-6 w-full">
            <div class="max-w-lg md:max-w-xl flex flex-col items-start gap-4">
              <div class="h-10 md:h-12 w-72 bg-white/95 rounded-sm"></div>
              <div class="flex flex-col gap-2 w-full max-w-md">
                <div class="h-4 w-full bg-white/80 rounded-sm"></div>
                <div class="h-4 w-5/6 bg-white/80 rounded-sm"></div>
                <div class="h-4 w-2/3 bg-white/80 rounded-sm"></div>
              </div>
              <div role="button" tabindex="0" class="h-11 w-36 bg-primary rounded-sm shadow-md mt-2 flex items-center justify-center cursor-pointer focus:outline-none focus:ring-2 focus:ring-white">
                <div class="h-3 w-16 bg-white/90 rounded-sm"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Region: Pagination Indicators -->

    <div class="swiper-pagination !z-30"></div>
  </div>
</section>
