<section class="wishlist-section bg-surface font-sans text-content py-8 sm:py-12">
  <div class="w-full max-w-content mx-auto px-4 lg:px-6">
    <!-- Page Header -->
    <!-- Region: Page Header - Title, subtitle, and breadcrumb -->

    <div data-region="page-header" class="mb-8">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-6 border-b border-outline/20">
        <div>
          <div class="h-8 sm:h-9 w-44 sm:w-56 bg-content/85 rounded-xs mb-2.5"></div>
          <div class="h-4 w-72 max-w-full bg-muted/60 rounded-xs"></div>
        </div>
        <div class="flex items-center gap-3">
          <button type="button" data-action="add-all" class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium shadow-xs hover:opacity-90 transition-opacity flex items-center justify-center cursor-pointer">
            <div class="h-3 w-28 bg-white/95 rounded-xs"></div>
          </button>
          <button type="button" data-action="clear-all" class="px-3.5 py-2 rounded-lg border border-outline/40 text-sm text-muted hover:text-content hover:bg-accent/30 transition-colors flex items-center justify-center cursor-pointer">
            <div class="h-3 w-16 bg-muted/70 rounded-xs"></div>
          </button>
        </div>
      </div>
    </div>

    <!-- Wishlist Grid -->
    <!-- Region: Wishlist Grid - Saved products collection grid -->

    <div data-region="wishlist-grid" id="wishlist-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>

    <!-- Empty Wishlist State -->
    <!-- Region: Empty State - Feedback when no items are available -->

    <div data-region="empty-state" id="wishlist-empty" class="hidden text-center py-16 sm:py-24 border border-dashed border-outline/30 rounded-2xl bg-accent/10">
      <div class="mx-auto size-16 rounded-full bg-accent/40 flex items-center justify-center text-muted mb-4">
        <span class="size-8 rounded-full border-2 border-dashed border-muted/60"></span>
      </div>
      <div class="h-6 w-48 bg-content/80 rounded-xs mx-auto mb-2"></div>
      <div class="h-3.5 w-64 bg-muted/60 rounded-xs mx-auto mb-6"></div>
      <button type="button" data-action="explore" class="inline-flex px-6 py-2.5 rounded-xl bg-primary text-white text-sm font-medium shadow-xs hover:opacity-90 transition-opacity cursor-pointer">
        <div class="h-3.5 w-24 bg-white/95 rounded-xs"></div>
      </button>
    </div>
  </div>
</section>
