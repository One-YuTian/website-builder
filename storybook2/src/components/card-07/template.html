<article class="min-w-0 overflow-hidden rounded-xl border border-outline/40 bg-surface font-sans text-content shadow-xs">
  <div class="relative">
    <button type="button" data-action="open-product" class="block w-full focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
      <span class="relative block w-full aspect-[5/4] overflow-hidden bg-accent">
        <span class="pointer-events-none absolute inset-0 flex items-center justify-center">
          <span class="relative block aspect-[6/5] w-1/4 min-w-4 max-w-12 overflow-hidden rounded-sm border border-muted">
            <span class="absolute right-[15%] top-[15%] size-1/5 rounded-full bg-muted"></span>
            <span class="absolute -bottom-1/4 left-[5%] size-3/4 rotate-45 border-l border-t border-muted"></span>
            <span class="absolute -bottom-1/4 right-0 size-1/2 rotate-45 border-l border-t border-muted"></span>
          </span>
        </span>
      </span>
    </button>
    <div class="pointer-events-none absolute left-2.5 top-2.5 rounded-md bg-primary px-2 py-0.5 text-xs font-bold text-white">-20%</div>
    <button type="button" data-action="toggle-wishlist" class="absolute right-2.5 top-2.5 flex size-8 items-center justify-center rounded-full bg-surface/85 shadow-xs text-muted hover:text-primary transition-colors focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
      <span class="block size-3.5 rounded-full bg-accent"></span>
    </button>
  </div>
  <div class="p-3.5 space-y-2.5">
    <span class="block h-[0.65em] w-1/4 rounded-sm bg-accent/80"></span>
    <div>
      <span class="block h-[0.75em] w-full rounded-sm bg-accent mb-1.5"></span>
      <span class="block h-[0.75em] w-2/3 rounded-sm bg-accent"></span>
    </div>
    <div class="flex items-baseline gap-2 pt-1">
      <span class="block h-[0.85em] w-20 rounded-sm bg-accent"></span>
      <span class="block h-[0.7em] w-12 rounded-sm bg-accent opacity-60"></span>
    </div>
    <button type="button" data-action="add-cart" class="w-full rounded-lg bg-primary py-2 px-4 flex items-center justify-center focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
      <span class="block h-[0.75em] w-20 rounded-sm bg-white/90"></span>
    </button>
  </div>
</article>
