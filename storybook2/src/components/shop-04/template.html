<section class="bg-surface font-sans text-content py-6 sm:py-8">
  <div class="w-full max-w-content mx-auto px-4 lg:px-6">
    <div class="flex flex-col lg:flex-row gap-6 lg:gap-8">
      <!-- Region: Filter Sidebar - Faceted search, categories, and price sliders -->

      <aside data-region="sidebar" class="hidden lg:block lg:w-64 lg:shrink-0">
        <div class="bg-surface rounded-xl border border-outline/60 p-5 sticky top-24 shadow-xs space-y-6">
          <div>
            <span class="block h-[1em] w-28 rounded-sm bg-accent text-sm mb-4"></span>
            <div class="space-y-2.5" id="category-radio-group">
              <label class="flex items-center gap-2.5 text-sm text-content cursor-pointer">
                <input type="radio" name="shop-category" value="all" checked class="accent-primary">
                <span class="block h-[0.75em] w-16 rounded-sm bg-accent"></span>
              </label>
              <label class="flex items-center gap-2.5 text-sm text-content cursor-pointer">
                <input type="radio" name="shop-category" value="cat-1" class="accent-primary">
                <span class="block h-[0.75em] w-24 rounded-sm bg-accent"></span>
              </label>
              <label class="flex items-center gap-2.5 text-sm text-content cursor-pointer">
                <input type="radio" name="shop-category" value="cat-2" class="accent-primary">
                <span class="block h-[0.75em] w-20 rounded-sm bg-accent"></span>
              </label>
              <label class="flex items-center gap-2.5 text-sm text-content cursor-pointer">
                <input type="radio" name="shop-category" value="cat-3" class="accent-primary">
                <span class="block h-[0.75em] w-28 rounded-sm bg-accent"></span>
              </label>
            </div>
          </div>

          <div class="pt-5 border-t border-outline/30">
            <span class="block h-[1em] w-24 rounded-sm bg-accent text-sm mb-4"></span>
            <div class="space-y-3">
              <div class="flex items-center gap-2">
                <input type="number" id="shop-price-min" placeholder="Min" class="w-full border border-outline/60 bg-surface rounded-lg px-3 py-1.5 text-xs text-content focus-visible:outline-2 focus-visible:outline-primary">
                <span class="text-muted">-</span>
                <input type="number" id="shop-price-max" placeholder="Max" class="w-full border border-outline/60 bg-surface rounded-lg px-3 py-1.5 text-xs text-content focus-visible:outline-2 focus-visible:outline-primary">
              </div>
              <button id="shop-apply-btn" type="button" class="w-full bg-primary text-white rounded-lg py-2 text-xs font-semibold hover:opacity-90 transition-opacity cursor-pointer">
                <span class="block h-[0.75em] w-16 mx-auto rounded-sm bg-white/40"></span>
              </button>
            </div>
          </div>
        </div>
      </aside>

      <div class="flex-1">
        <!-- Region: Catalog Toolbar - Item count, sorting dropdown, and view mode toggle -->

        <div data-region="toolbar" class="flex flex-wrap sm:flex-nowrap items-center justify-between mb-6 p-3 bg-accent/30 rounded-xl border border-outline/40 gap-3">
          <div class="flex items-center justify-between w-full sm:w-auto gap-3">
            <button id="mobile-filter-btn" type="button" class="lg:hidden flex items-center gap-2 border border-outline/60 bg-surface rounded-lg px-3 py-1.5 text-sm text-content hover:border-primary/50 cursor-pointer shadow-xs shrink-0">
              <span class="flex flex-col justify-between size-3.5 py-0.5 pointer-events-none">
                <span class="h-0.5 w-full bg-current rounded-xs"></span>
                <span class="h-0.5 w-2/3 bg-current rounded-xs"></span>
                <span class="h-0.5 w-1/3 bg-current rounded-xs"></span>
              </span>
              <span class="block h-[0.75em] w-12 rounded-sm bg-accent pointer-events-none"></span>
            </button>

            <div class="flex items-center gap-2 text-sm text-content">
              <span class="hidden md:block h-[0.75em] w-16 rounded-sm bg-accent"></span>
              <div class="relative inline-block text-left" data-dropdown="sort">
                <button type="button" data-dropdown-trigger class="flex items-center justify-between gap-2.5 border border-outline/60 bg-surface rounded-lg px-2.5 py-1.5 text-sm text-content hover:border-primary/50 cursor-pointer focus-visible:outline-2 focus-visible:outline-primary shadow-xs">
                  <span class="block h-[0.75em] w-16 sm:w-20 rounded-sm bg-accent pointer-events-none" data-dropdown-label></span>
                  <span class="size-1.5 rotate-45 border-r-2 border-b-2 border-content inline-block pointer-events-none"></span>
                </button>
                <div class="hidden absolute left-0 mt-1.5 w-36 rounded-lg border border-outline/50 bg-surface shadow-lg z-30 py-1" data-dropdown-menu>
                  <div role="button" tabindex="0" class="flex items-center px-3 py-2 hover:bg-accent/40 cursor-pointer" data-value="default">
                    <span class="block h-[0.75em] w-14 rounded-sm bg-accent pointer-events-none"></span>
                  </div>
                  <div role="button" tabindex="0" class="flex items-center px-3 py-2 hover:bg-accent/40 cursor-pointer" data-value="asc">
                    <span class="block h-[0.75em] w-20 rounded-sm bg-accent pointer-events-none"></span>
                  </div>
                  <div role="button" tabindex="0" class="flex items-center px-3 py-2 hover:bg-accent/40 cursor-pointer" data-value="desc">
                    <span class="block h-[0.75em] w-20 rounded-sm bg-accent pointer-events-none"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-end w-full sm:w-auto gap-2 text-sm text-muted">
            <span class="block h-[0.75em] w-16 sm:w-20 rounded-sm bg-accent"></span>
            <span id="product-count" class="font-bold text-content ml-1">8</span>
          </div>
        </div>

        <!-- Region: Products Grid - Responsive product card showcase -->


        <div data-region="products-grid" id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
      </div>
    </div>
  </div>

  <div id="mobile-filter-drawer" class="fixed inset-0 z-50 hidden">
    <div id="mobile-filter-overlay" class="absolute inset-0 bg-black/50 transition-opacity"></div>
    <div id="mobile-filter-content" class="absolute left-0 top-0 h-full w-72 sm:w-80 bg-surface shadow-2xl p-5 overflow-y-auto flex flex-col justify-between z-10">
      <div class="space-y-6">
        <div class="flex items-center justify-between pb-3 border-b border-outline/30">
          <span class="block h-[1em] w-24 rounded-sm bg-accent text-base"></span>
          <button id="mobile-filter-close" type="button" class="size-7 rounded-lg hover:bg-accent/40 flex items-center justify-center text-muted hover:text-content cursor-pointer">
            <span class="size-3 relative block">
              <span class="absolute inset-0 m-auto h-0.5 w-full bg-current rotate-45 rounded-xs"></span>
              <span class="absolute inset-0 m-auto h-0.5 w-full bg-current -rotate-45 rounded-xs"></span>
            </span>
          </button>
        </div>

        <div>
          <span class="block h-[1em] w-28 rounded-sm bg-accent text-sm mb-4"></span>
          <div class="space-y-2.5">
            <label class="flex items-center gap-2.5 text-sm text-content cursor-pointer">
              <input type="radio" name="mobile-shop-category" value="all" checked class="accent-primary">
              <span class="block h-[0.75em] w-16 rounded-sm bg-accent"></span>
            </label>
            <label class="flex items-center gap-2.5 text-sm text-content cursor-pointer">
              <input type="radio" name="mobile-shop-category" value="cat-1" class="accent-primary">
              <span class="block h-[0.75em] w-24 rounded-sm bg-accent"></span>
            </label>
            <label class="flex items-center gap-2.5 text-sm text-content cursor-pointer">
              <input type="radio" name="mobile-shop-category" value="cat-2" class="accent-primary">
              <span class="block h-[0.75em] w-20 rounded-sm bg-accent"></span>
            </label>
            <label class="flex items-center gap-2.5 text-sm text-content cursor-pointer">
              <input type="radio" name="mobile-shop-category" value="cat-3" class="accent-primary">
              <span class="block h-[0.75em] w-28 rounded-sm bg-accent"></span>
            </label>
          </div>
        </div>

        <div class="pt-5 border-t border-outline/30">
          <span class="block h-[1em] w-24 rounded-sm bg-accent text-sm mb-4"></span>
          <div class="space-y-3">
            <div class="flex items-center gap-2">
              <input type="number" id="mobile-price-min" placeholder="Min" class="w-full border border-outline/60 bg-surface rounded-lg px-3 py-1.5 text-xs text-content focus-visible:outline-2 focus-visible:outline-primary">
              <span class="text-muted">-</span>
              <input type="number" id="mobile-price-max" placeholder="Max" class="w-full border border-outline/60 bg-surface rounded-lg px-3 py-1.5 text-xs text-content focus-visible:outline-2 focus-visible:outline-primary">
            </div>
            <button id="mobile-apply-btn" type="button" class="w-full bg-primary text-white rounded-lg py-2.5 text-xs font-semibold hover:opacity-90 transition-opacity cursor-pointer">
              <span class="block h-[0.75em] w-16 mx-auto rounded-sm bg-white/40"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
