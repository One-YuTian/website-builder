<section class="bg-surface font-sans text-content pb-4 sm:pb-6">
  <div class="w-full max-w-content mx-auto px-4 lg:px-6">
    <!-- Region: Desktop Banner Slider -->

    <div class="hidden lg:block relative w-full h-[550px] rounded-xl overflow-hidden bg-accent">
      <div class="swiper banner-swiper h-full w-full">
        <div class="swiper-wrapper h-full">
          <div class="swiper-slide !h-full">
            <div class="w-full h-full flex items-center justify-center bg-accent">
              <span class="relative block aspect-[6/5] w-1/4 min-w-8 max-w-20 overflow-hidden rounded-sm border border-muted">
                <span class="absolute right-[15%] top-[15%] size-1/5 rounded-full bg-muted"></span>
                <span class="absolute -bottom-1/4 left-[5%] size-3/4 rotate-45 border-l border-t border-muted"></span>
                <span class="absolute -bottom-1/4 right-0 size-1/2 rotate-45 border-l border-t border-muted"></span>
              </span>
            </div>
          </div>
          <div class="swiper-slide !h-full">
            <div class="w-full h-full flex items-center justify-center bg-accent">
              <span class="relative block aspect-[6/5] w-1/4 min-w-8 max-w-20 overflow-hidden rounded-sm border border-muted">
                <span class="absolute right-[15%] top-[15%] size-1/5 rounded-full bg-muted"></span>
                <span class="absolute -bottom-1/4 left-[5%] size-3/4 rotate-45 border-l border-t border-muted"></span>
                <span class="absolute -bottom-1/4 right-0 size-1/2 rotate-45 border-l border-t border-muted"></span>
              </span>
            </div>
          </div>
        </div>
        <!-- Region: Pagination Indicators -->

        <div class="swiper-pagination !z-30"></div>
      </div>
      <div class="absolute inset-x-0 bottom-0 h-32 lg:h-40 bg-gradient-to-t from-surface to-transparent pointer-events-none z-20"></div>
    </div>

    <!-- Region: Mobile Banner Slider -->


    <div class="lg:hidden relative w-full aspect-[50/21] rounded-xl overflow-hidden bg-accent">
      <div class="swiper mobile-banner-swiper absolute inset-0 h-full w-full">
        <div class="swiper-wrapper h-full">
          <div class="swiper-slide !h-full">
            <div class="w-full h-full flex items-center justify-center bg-accent">
              <span class="relative block aspect-[6/5] w-1/4 min-w-8 max-w-20 overflow-hidden rounded-sm border border-muted">
                <span class="absolute right-[15%] top-[15%] size-1/5 rounded-full bg-muted"></span>
                <span class="absolute -bottom-1/4 left-[5%] size-3/4 rotate-45 border-l border-t border-muted"></span>
                <span class="absolute -bottom-1/4 right-0 size-1/2 rotate-45 border-l border-t border-muted"></span>
              </span>
            </div>
          </div>
          <div class="swiper-slide !h-full">
            <div class="w-full h-full flex items-center justify-center bg-accent">
              <span class="relative block aspect-[6/5] w-1/4 min-w-8 max-w-20 overflow-hidden rounded-sm border border-muted">
                <span class="absolute right-[15%] top-[15%] size-1/5 rounded-full bg-muted"></span>
                <span class="absolute -bottom-1/4 left-[5%] size-3/4 rotate-45 border-l border-t border-muted"></span>
                <span class="absolute -bottom-1/4 right-0 size-1/2 rotate-45 border-l border-t border-muted"></span>
              </span>
            </div>
          </div>
        </div>
        <!-- Region: Pagination Indicators -->

        <div class="swiper-pagination !z-30"></div>
      </div>
    </div>
  </div>
</section>
