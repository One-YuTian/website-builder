<header class="bg-secondary font-sans text-on-secondary">
  <div data-region="header-content" class="content-container grid grid-cols-[auto_minmax(0,1fr)] items-center gap-x-4 gap-y-3 pb-3 pt-2 md:grid-cols-[auto_minmax(0,1fr)_auto] md:gap-x-8 md:pb-4">
    <div role="button" tabindex="0" data-destination="home" class="order-1 flex h-14 shrink-0 items-center rounded-sm focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
      <span class="relative flex h-10 w-32 items-center justify-center overflow-hidden rounded-xl bg-accent select-none text-xs font-semibold tracking-widest text-muted">LOGO</span>
    </div>
    <form role="search" class="relative order-3 col-span-2 min-w-0 md:order-2 md:col-span-1 md:mx-auto md:w-full md:max-w-2xl">
      <div class="relative flex h-11 items-center rounded-full bg-surface text-content focus-within:ring-2 focus-within:ring-primary">
        <input type="search" name="query" autocomplete="off" class="peer h-full w-full min-w-0 rounded-full border-0 bg-transparent py-2 pl-4 pr-2 outline-none">
        <span data-region="search-placeholder" class="pointer-events-none absolute left-4"><span class="block h-[0.75em] w-36 rounded-sm bg-accent"></span></span>
        <button type="submit" class="mr-1 flex size-10 shrink-0 items-center justify-center rounded-full focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
          <span class="block size-4 rounded-full bg-accent"></span>
        </button>
      </div>
      <ul data-region="search-suggestions" hidden class="absolute inset-x-0 top-full z-20 mt-2 max-h-80 overflow-y-auto rounded-xl border border-outline bg-surface p-2 text-content shadow-xl"></ul>
    </form>
    <div class="order-2 flex items-center justify-end gap-1 md:order-3 md:gap-2">
      <div class="relative">
        <button type="button" data-action="account" class="relative flex size-10 shrink-0 items-center justify-center rounded-lg hover:bg-on-secondary/10 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
          <span class="block size-5 rounded-full bg-accent"></span>
        </button>
        <div data-region="account-panel" hidden class="absolute right-0 top-full z-20 mt-2 w-48 rounded-xl border border-outline bg-surface p-3 text-content shadow-xl">
          <span class="block h-[0.75em] w-24 rounded-sm bg-accent mb-3"></span>
          <div class="flex flex-col items-start gap-2">
            <div role="button" tabindex="0" data-destination="orders" class="py-2 hover:opacity-75"><span class="block h-[0.75em] w-20 rounded-sm bg-accent"></span></div>
            <button type="button" data-action="logout" class="py-2 hover:opacity-75"><span class="block h-[0.75em] w-16 rounded-sm bg-accent"></span></button>
          </div>
        </div>
      </div>
      <button type="button" data-action="wishlist" class="relative flex size-10 shrink-0 items-center justify-center rounded-lg hover:bg-on-secondary/10 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
        <span class="block size-5 rounded-full bg-accent"></span>
      </button>
      <button type="button" data-action="cart" class="relative hidden md:flex size-10 shrink-0 items-center justify-center rounded-lg hover:bg-on-secondary/10 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
        <span class="block size-5 rounded-full bg-accent"></span>
      </button>
      <button type="button" data-action="menu" class="flex md:hidden size-10 shrink-0 items-center justify-center rounded-lg hover:bg-on-secondary/10 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
        <span class="block size-5 rounded-full bg-accent"></span>
      </button>
    </div>
    <nav class="order-4 col-span-3 hidden items-center justify-center gap-8 md:flex">
      <div role="button" tabindex="0" data-destination="home" class="rounded-sm py-2 hover:opacity-75 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-14 rounded-sm bg-accent"></span></div>
      <div role="button" tabindex="0" data-destination="shop" class="rounded-sm py-2 hover:opacity-75 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-14 rounded-sm bg-accent"></span></div>
      <div role="button" tabindex="0" data-destination="about" class="rounded-sm py-2 hover:opacity-75 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-14 rounded-sm bg-accent"></span></div>
      <div role="button" tabindex="0" data-destination="contact" class="rounded-sm py-2 hover:opacity-75 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-14 rounded-sm bg-accent"></span></div>
      <div role="button" tabindex="0" data-destination="login" class="rounded-sm py-2 hover:opacity-75 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-12 rounded-sm bg-accent"></span></div>
      <div role="button" tabindex="0" data-destination="register" class="rounded-sm py-2 hover:opacity-75 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-12 rounded-sm bg-accent"></span></div>
    </nav>
  </div>
</header>
<dialog class="fixed inset-y-0 left-0 m-0 h-dvh max-h-none w-80 max-w-[calc(100vw-2rem)] overflow-y-auto overscroll-contain border-0 bg-surface p-6 text-content shadow-xl backdrop:bg-black/50">
  <div class="mb-6 flex items-center justify-between gap-4">
    <span class="relative flex h-8 w-28 items-center justify-center overflow-hidden rounded-lg bg-accent select-none text-xs font-semibold tracking-widest text-muted">LOGO</span>
    <button type="button" autofocus data-action="close-menu" class="flex size-10 items-center justify-center rounded-lg hover:bg-accent/40 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">
      <span class="block size-5 rounded-full bg-accent"></span>
    </button>
  </div>
  <nav class="space-y-3">
    <div role="button" tabindex="0" data-destination="home" class="block rounded-lg px-2 py-3 hover:bg-accent/40"><span class="block h-[0.75em] w-24 rounded-sm bg-accent"></span></div>
    <div role="button" tabindex="0" data-destination="shop" class="block rounded-lg px-2 py-3 hover:bg-accent/40"><span class="block h-[0.75em] w-24 rounded-sm bg-accent"></span></div>
    <div role="button" tabindex="0" data-destination="about" class="block rounded-lg px-2 py-3 hover:bg-accent/40"><span class="block h-[0.75em] w-24 rounded-sm bg-accent"></span></div>
    <div role="button" tabindex="0" data-destination="contact" class="block rounded-lg px-2 py-3 hover:bg-accent/40"><span class="block h-[0.75em] w-24 rounded-sm bg-accent"></span></div>
    <div role="button" tabindex="0" data-destination="wishlist" class="block rounded-lg px-2 py-3 hover:bg-accent/40"><span class="block h-[0.75em] w-24 rounded-sm bg-accent"></span></div>
  </nav>
  <div class="mt-6 flex flex-col items-start gap-3 border-t border-outline px-2 pt-6">
    <div role="button" tabindex="0" data-destination="login" class="rounded-sm py-2 hover:opacity-75 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-12 rounded-sm bg-accent"></span></div>
    <div role="button" tabindex="0" data-destination="register" class="rounded-sm py-2 hover:opacity-75 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"><span class="block h-[0.75em] w-12 rounded-sm bg-accent"></span></div>
  </div>
</dialog>
